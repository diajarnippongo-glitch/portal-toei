<style>
:root{--bg:#15122e;--sb:#1c1940;--cd:rgba(255,255,255,.055);--ln:rgba(255,255,255,.1);--fg:#ecebff;--mu:#9d9bc7;--bl:#5b8cff;--rd:#ff5470;--ip:rgba(255,255,255,.08);box-sizing:border-box;color-scheme:dark}

header{position:sticky;top:0;z-index:5;background:rgba(21,18,46,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:10px}
img.lg{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid rgba(255,255,255,.3);box-shadow:0 0 14px rgba(91,140,255,.65)}
header b{font-size:18px;font-weight:600;flex:1;background:linear-gradient(90deg,#7fb0ff,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}#hs{display:flex;align-items:center;gap:8px}
nav{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;background:rgba(28,25,64,.88);backdrop-filter:blur(16px);border:1px solid var(--ln);border-radius:20px;padding:6px 4px;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.4),0 0 24px rgba(91,140,255,.15)}
nav button{flex:1;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:5px 0;cursor:pointer}

main{padding:14px;max-width:900px;margin:auto}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:8px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:0 0 24px rgba(91,140,255,.08)}
.kv{font-size:26px;font-weight:600}.m{font-size:11.5px;color:var(--mu)}
.h{color:#8fb4ff;font-size:12px;font-weight:600;margin:18px 2px 8px}
.sc{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;font-size:12.5px;width:100%}td,th{padding:7px 8px;text-align:center;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-weight:500;font-size:11.5px}td:first-child{text-align:left;position:sticky;left:0;background:var(--sb)}
input,select,button{font:inherit}input,select{background:var(--ip);color:var(--fg);border:1px solid var(--ln);border-radius:10px;padding:5px 9px;max-width:100%}
option{background:#1c1940;color:#ecebff}
input[type=number]{width:62px}input[type=checkbox]{width:18px;height:18px;accent-color:#5b8cff}
.r{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--ln)}.r span{flex:1}.r b{width:34px;text-align:right;font-weight:500}
.r i{width:110px;height:10px;border-radius:6px;background:rgba(0,0,0,.4);box-shadow:inset 0 2px 4px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.08)}
.r u{display:block;height:10px;border-radius:6px;background-image:linear-gradient(90deg,#ef4444,#f97316,#facc15,#3b82f6,#22c55e);box-shadow:inset 0 2px 2px rgba(255,255,255,.55),inset 0 -3px 3px rgba(0,0,0,.3),0 0 8px rgba(91,140,255,.5)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bt{background:linear-gradient(135deg,#5b8cff,#8b5cf6);color:#fff;border:0;border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 0 14px rgba(91,140,255,.35)}.bt.s{background:rgba(255,255,255,.1);box-shadow:none;color:var(--fg)}
.w{color:var(--rd);font-weight:600}.ok{color:#7fb0ff}
.sg{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.sg button{background:var(--cd);border:1px solid var(--ln);color:var(--mu);border-radius:20px;padding:6px 14px;white-space:nowrap;cursor:pointer}.sg button.on{background:linear-gradient(135deg,#5b8cff,#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 0 14px rgba(91,140,255,.4)}
.rot{writing-mode:vertical-rl;transform:rotate(180deg);height:130px;padding:4px;font-size:12px}

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const D=24,W=5,SK=['Jikoshoukai singkat','Menyebut jam bangun dan tidur','Menyebut sarapan pagi','Bilang pergi ke sekolah','Menjelaskan aktivitas bangun sampai tidur','Menyebut hari dan tanggal','Menyebut angka dan harga','Menanyakan tempat','Meminta atau membeli barang','Menyebut keluarga dan pekerjaan','Mengajak dan menerima ajakan','Menyatakan suka atau tidak','Bercerita kegiatan kemarin','Salam sehari-hari','Minta izin, maaf, terima kasih','Membaca hiragana dan katakana'];
const KT=['Persiapan Wawancara','Kanji','Budaya Jepang'];
const EK=[[0,'Jikoshoukai untuk wawancara'],[0,'Motivasi kerja'],[0,'Sopan santun masuk ruangan'],[0,'Pertanyaan umum dan jawaban'],[0,'Simulasi wawancara 1'],[1,'Kanji angka 一〜十'],[1,'Kanji hari 日月火水木金土'],[1,'Kanji 百千万円'],[1,'Kanji tempat 駅学校会社'],[2,'Ojigi dan etika bersalam'],[2,'Aturan kerja (報連相)'],[2,'Etika makan'],[2,'Aturan sampah']];
const def=()=>({set:{kelas:'Bahasa Jepang – Minna no Nihongo Kiso 1',guru:'',b0:0,b1:10,kkm:70,minh:80,w:[20,25,15,40]},sis:[],nx:1,days:Array.from({length:D},()=>({t:'',b:'',o:'',p:'',ok:false})),abs:{},pr:{},kos:{},shou:{},mtk:{},uas:{},can:{},sk:SK.slice(),kt:KT.slice(),bab:{},ek:EK.map(e=>({k:KT[e[0]],n:e[1],d:false}))});
let S,T='dash',IS='jur',V='all',NV='kos',DB=null,tm,Rt={ks:[{id:'k1',n:'Kelas 1'}],as:{}},CS={},cur='k1',ME=null,ROLE='local',US=[];
try{const L=JSON.parse(localStorage.getItem('kjp2'));if(L){Rt=L.Rt;CS=L.CS}else{const o=JSON.parse(localStorage.getItem('kjp'));if(o)CS.k1=o}}catch(e){}
const use=id=>{CS[id]={...def(),...(CS[id]||{})};S=CS[id];cur=id;V='all'};use(Rt.ks[0].id);
let CFM=-1,DEL=null,SESS=null;const CFG=window.CFG||{};let sb=(CFG.url&&CFG.url.startsWith('https://')&&window.supabase)?supabase.createClient(CFG.url,CFG.key):null;const ck=r=>{if(r&&r.error)alert('Gagal menyimpan: '+r.error.message)};const rg=()=>[+(S.set.b0??0),+(S.set.b1??S.set.target??10)],KC=()=>S.kt;
const $=s=>document.querySelector(s),g=(o,...p)=>p.reduce((a,k)=>a==null?a:a[k],o),vals=o=>o?Object.values(o):[];
const avg=a=>{a=a.filter(x=>typeof x=='number');return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const pc=x=>x==null?'-':Math.round(x*100)+'%',f1=x=>x==null?'-':x.toFixed(1),rn=n=>[...Array(n).keys()];
const I=(p,v,x='')=>`<input data-p="${p}" value="${String(v??'').replace(/"/g,'&quot;')}" ${x}>`;
const N=(p,v,m=100)=>`<input type="number" min="0" max="${m}" data-p="${p}" value="${v??''}">`;
const CB=(p,v)=>`<input type="checkbox" data-p="${p}" ${v?'checked':''}>`;
const SEL=(p,v,o)=>`<select data-p="${p}">${o.map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('')}</select>`;
function save(){try{if(!sb)localStorage.setItem('kjp2',JSON.stringify({Rt,CS}))}catch(e){}clearTimeout(tm);tm=setTimeout(wr,700)}
function wr(){if(!sb||['guest','out','tunggu'].includes(ROLE))return;const up=()=>{if(Rt.ks.some(k=>k.id==cur))sb.from('kelas').update({data:S}).eq('id',cur).then(ck)};
if(ROLE=='admin')sb.from('kelas').upsert(Rt.ks.map(k=>({id:k.id,nama:k.n}))).then(r=>{ck(r);up()});else up()}
function st(s){const id=s.id,a=vals(S.abs[id]).filter(Boolean),p=vals(S.pr[id]).filter(Boolean);
const h=a.length?a.filter(x=>x=='H').length/a.length:null,pr=p.length?p.filter(x=>x!='✗').length/p.length:null;
const k=avg(vals(S.kos[id])),sh=avg(vals(S.shou[id])),m=avg(vals(S.mtk[id])),u=S.uas[id]??null,w=S.set.w;let n=0,d=0;
[k,sh,m,u].forEach((x,i)=>{if(x!=null){n+=x*w[i];d+=w[i]}});const na=d?n/d:null,gr=na==null?'-':na>=85?'A':na>=75?'B':na>=65?'C':'D';
const cn=vals(S.can[id]).filter(Boolean).length/(S.sk.length||1);
return{s,h,pr,k,sh,m,u,na,gr,cn,warn:(h!=null&&h*100<S.set.minh)||(na!=null&&na<S.set.kkm)}}
const dn=(p,c,t,s)=>`<div class="c" style="text-align:center"><b>${t}</b><br><svg viewBox="0 0 100 100" width="110" height="110" style="filter:drop-shadow(0 0 5px rgba(91,140,255,.55))"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset=".25" stop-color="#f97316"/><stop offset=".5" stop-color="#facc15"/><stop offset=".75" stop-color="#3b82f6"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs><circle cx="50" cy="50" r="36" fill="none" style="stroke:var(--ln)" stroke-width="14"/><circle cx="50" cy="50" r="36" fill="none" stroke="url(#gr)" stroke-width="14" stroke-dasharray="${226.2*p} 226.2" transform="rotate(-90 50 50)"/><text x="50" y="55" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">${Math.round(p*100)}%</text></svg><div class="m">${s}</div></div>`;
const bar=(l,v)=>{const p=v==null?0:Math.max(0,Math.min(100,v));return `<div class="r"><span>${l}</span><i><u style="width:${p}%;background-size:${p?10000/p:100}% 100%"></u></i><b>${v==null?'-':Math.round(v)}</b></div>`};
const kp=(t,v,s)=>`<div class="c"><div class="m">${t}</div><div class="kv">${v}</div><div class="m">${s}</div></div>`;
const hd=t=>`<div class="h">${t}</div>`;
function dash(){const R=S.sis.map(st),one=V!='all'&&S.sis.find(s=>s.id==V),L=one?R.filter(r=>r.s.id==V):R,A=k=>avg(L.map(r=>r[k])),[b0,b1]=rg(),tb=b1-b0+1;
let bd=0;for(let i=b0;i<=b1;i++){const b=S.bab[i]||{};bd+=(b.m?1:0)+(b.p?1:0)}
const hr=S.days.filter(d=>d.ok).length,ed=S.ek.filter(e=>e.d).length,ne=S.ek.length||1,nl=A('na'),wn=L.filter(r=>r.warn).length;
let h=`<p>Tampilkan: <select id="v"><option value="all">Seluruh kelas</option>${S.sis.map(s=>`<option value="${s.id}"${s.id==V?' selected':''}>${s.n}</option>`).join('')}</select></p>`;
h+=`<div class="k">${kp('Siswa',one?one.n:S.sis.length,one?'dipilih':'terdaftar')}${kp('Kehadiran',pc(A('h')),'minimum '+S.set.minh+'%')}${kp('PR dikerjakan',pc(A('pr')),'rata-rata')}${kp('Nilai akhir',f1(nl),'KKM '+S.set.kkm+(one?' | Grade '+L[0].gr:''))}${kp('Target kelas','Bab '+b0+'–'+b1,tb+' bab')}${kp('Hari belajar',hr+' / '+D,'terlaksana')}</div>`;
if(!one)h+=`<div class="c ${wn?'w':'ok'}">${wn?wn+' siswa perlu perhatian (kehadiran atau nilai di bawah batas)':'Semua siswa aman'}</div>`;
h+=hd('Progres pembelajaran (dari centang)')+`<div class="g3">${dn(bd/(tb*2||1),'#3b82f6','Target bab',bd+' dari '+tb*2+' centang')}${dn(hr/D,'#60a5fa','Hari belajar',hr+' dari '+D+' hari')}${dn(ed/ne,'#93c5fd','Pembelajaran ekstra',ed+' dari '+ne+' topik')}</div>`;
h+=hd('Rata-rata nilai')+`<div class="c">${bar('Kosakata harian',A('k'))}${bar('Shoutesuto mingguan',A('sh'),'#93c5fd')}${bar('Matematika mingguan',A('m'),'#2563eb')}${bar('Ujian akhir',A('u'),'#60a5fa')}</div>`;
if(one){h+=hd('Kemampuan')+`<div class="c">${S.sk.map((k,j)=>`<div class="r"><span>${k}</span><b style="width:auto" class="${g(S.can,one.id,j)?'ok':'m'}">${g(S.can,one.id,j)?'Sudah bisa':'Belum'}</b></div>`).join('')}</div>`;if((one.r||[]).length)h+=hd('Riwayat kelas sebelumnya')+`<div class="c">${one.r.map(x=>`<div class="r"><span>${x.k}</span><b style="width:auto">${pc(x.h)} | ${f1(x.n)} | ${x.g}</b></div>`).join('')}</div>`}
else{h+=hd('Kemampuan kelas (% siswa mampu)')+`<div class="c">${S.sk.map((k,j)=>bar(k,S.sis.length?S.sis.filter(s=>g(S.can,s.id,j)).length/S.sis.length*100:null,'#60a5fa')).join('')}</div>`;
h+=hd('Rekap per siswa')+`<div class="sc"><table><tr><th>Nama<th>% Hadir<th>% PR<th>Nilai<th>Grade<th>Kemampuan<th>Status${R.map(r=>`<tr><td>${r.s.n}<td class="${r.h!=null&&r.h*100<S.set.minh?'w':''}">${pc(r.h)}<td>${pc(r.pr)}<td class="${r.na!=null&&r.na<S.set.kkm?'w':''}">${f1(r.na)}<td>${r.gr}<td>${pc(r.cn)}<td class="${r.warn?'w':'ok'}">${r.warn?'Perlu perhatian':'Aman'}`).join('')}</table></div>`}
h+=hd('Pembelajaran ekstra')+`<div class="c">${KC().map(k=>{const e=S.ek.filter(x=>x.k==k);return bar(k,e.length?e.filter(x=>x.d).length/e.length*100:null,'#2563eb')}).join('')}</div>`;
return h}
function mat(key,n,cell,hdr){if(!S.sis.length)return'<p>Tambahkan siswa dulu di tab Siswa.</p>';
return`<div class="sc"><table><tr><th>Nama${rn(n).map(j=>`<th>${hdr(j)}`).join('')}${S.sis.map(s=>`<tr><td>${s.n}${rn(n).map(j=>`<td>${cell(`${key}.${s.id}.${j}`,g(S,key,s.id,j))}`).join('')}`).join('')}</table></div>`}
